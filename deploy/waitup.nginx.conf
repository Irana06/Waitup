# Waitup behind nginx. Socket.IO needs the WebSocket upgrade headers below.
map $http_upgrade $waitup_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $waitup_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Rooms keep a socket open for the whole watch session.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
